/* ============ storage ============ */
const store = {

// Aircraft pre-fed in v1.1, removed in v1.2. Only one-way hashes are kept here, to clear them from phones that update.
const OLD_SEED_HASHES = ["k4unpr","1j34x0k","1xspm3i","g20ro1","i6r4v0","1luumyc","8cfpni","1cie74v"];
const hashStr = s => { let h = 0x811c9dc5; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(36); };
function seed(){
  const v = store.get("seed",0);

/* ============ maths ============ */
const n = v => { if (v===null || v===undefined || String(v).trim()==="") return NaN; const x = parseFloat(String(v).replace(/,/g,"")); return isFinite(x) ? x : NaN; };
function atmos(elev, qnh, oat){

  const da = pa + 120 * (oat - isa);
  const mpa = Math.min(1, Math.max(0.75, 0.80 + 0.01 * Math.floor(da / 660)));
  return { pa, p, sigma, isa, da, mpa };
}
function heli(id){ return DB.helipads.find(h => h.id === id); }
function slotLb(s){ const q = n(s.qty), w = n(s.wt); return (isNaN(q)||isNaN(w)) ? 0 : q*w; }
function miscLb(){ return C.slots.reduce((a,s) => a + (s.item ? slotLb(s) : 0), 0); }
function lessFuelLb(){
  const parts = [n(C.emptyLb), n(C.pilotLb), n(C.copilotLb)].map(x => isNaN(x) ? 0 : x);
  return parts[0] + parts[1] + parts[2] + miscLb();
}
function compute(){
  const r = {};
  const elev = n(C.depElev), qnh = n(C.qnh), oat = n(C.oat), cpi = n(C.cpi);
  if (![elev,qnh,oat].some(isNaN)){
    Object.assign(r, atmos(elev, qnh, oat));
    if (!isNaN(cpi)) r.maxHover = Math.min(K * cpi * r.sigma, CAP);
  }
  const fuelL = n(C.fuel);
  r.fuelLb = isNaN(fuelL) ? 0 : fuelL * FUEL;
  r.lessFuel = lessFuelLb();
  r.auw = r.lessFuel + r.fuelLb;
  r.hasWeights = r.auw > 0;
  if (r.sigma && r.hasWeights){
    r.hp = r.auw / (K * r.sigma);
    if (r.maxHover !== undefined) r.margin = r.maxHover - r.auw;
  }
  // cutoff power
  const de = n(C.dstElev), dq = n(C.dstQnh), dt = n(C.dstOat), burnL = n(C.burn);
  const dh = heli(C.dstHeli);
  r.toMargin = dh ? (dh.margin || .10) : .10;
  if (r.sigma && ![de,dq,dt].some(isNaN)){
    const d = atmos(de, dq, dt);
    r.dst = d;
    r.usable = r.toMargin >= .15 ? Math.min(0.85, d.mpa - 0.15) : d.mpa - 0.10;
    r.maxLand = K * r.usable * d.sigma;
    r.burnLb = isNaN(burnL) ? 0 : burnL * FUEL;
    r.maxDep = Math.min(r.maxLand + r.burnLb, CAP);
    r.cutoff = r.maxDep / (K * r.sigma);
  }
  return r;
}

function longPress(el, fn){

    <div class="slot" data-i="${i}">
      <div class="slotrow"><select class="sel" data-f="item" aria-label="Item ${i+1}">${itemOptions(s.item)}</select>
        <button class="iconbtn" data-del="${i}" aria-label="Remove item ${i+1}">${ICON.x}</button></div>
      ${s.item==="other" ? `<div class="box"><input class="txt" data-f="name" inputmode="text" placeholder="Item name" value="${esc(s.name)}" aria-label="Custom item name"></div>` : ""}
      <div class="slotnums">
        <div class="field"><span class="flabel">Qty</span><div class="box"><input data-f="qty" inputmode="numeric" value="${esc(s.qty)}" aria-label="Quantity"></div></div>
        <div class="field"><span class="flabel">Each</span><div class="box"><input data-f="wt" inputmode="decimal" value="${esc(s.wt)}" aria-label="Weight each in lb"><span class="unit">lb</span></div></div>
        <div class="tot"><small>Total</small><span data-tot>${s.item ? fmt(slotLb(s),1)+" lb" : "—"}</span></div>
      </div>
    </div>`).join("");
  $$(".slot", wrap).forEach(el => {
    const i = +el.dataset.i;
    $$("[data-f]", el).forEach(inp => {
      const f = inp.dataset.f;
      inp.addEventListener(inp.tagName === "SELECT" ? "change" : "input", e => {
        const s = C.slots[i]; s[f] = e.target.value;
        if (f === "item"){
          const it = DB.items.find(x => x.id === s.item);
          if (it) s.wt = String(it.wt); else if (s.item !== "other") s.wt = "";
          if (s.item === "other" && !s.wt) s.wt = "";
          saveCurrent(); renderSlots(); return;
        }
        $("[data-tot]", el).textContent = s.item ? fmt(slotLb(s),1)+" lb" : "—";
        saveCurrent(); updateWeights();
      });
    });
  });
  $$("[data-del]", wrap).forEach(b => b.addEventListener("click", () => { C.slots.splice(+b.dataset.del,1); saveCurrent(); renderSlots(); }));
  updateWeights();
}
function updateWeights(){
  const m = $("#w-misc"), t = $("#w-tot");
  if (m) m.textContent = fmt(miscLb(),1) + " lb";
  if (t){ const lb = lessFuelLb(); t.innerHTML = `${fmt(lb,1)} lb<small>${fmt(lb/LBKG,1)} kg</small>`; }
}

/* ============ HISTORY ============ */
function renderHistory(){
  const items = DB.history;
  app.innerHTML = appbar("history") + `<main>
    <div class="helptext">Tap a calculation to open it. Long press to delete it.</div>
    <div class="list" id="hl">${items.length ? items.map(h => {
      const s = h.sum || {};
      const d = new Date(h.ts);
      const neg = s.margin!==undefined && s.margin < 0;
      return `<button class="hcard" data-h="${h.id}">
        <div class="top"><span class="nm">${esc(h.name)}</span><span class="dt">${d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"2-digit"})} ${d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false})}</span></div>
        <div class="hgrid">
          <div><span class="k">${s.dep?esc(s.dep):"Altitude"}</span><span class="v">${fmt(s.elev)} ft</span></div>
          <div><span class="k">Temp</span><span class="v">${fmt(s.oat,1)} °C</span></div>
          <div><span class="k">Hover power</span><span class="v">${fx2(s.hp)}</span></div>
          <div><span class="k">Load margin</span><span class="v ${neg?"neg":""}">${fmt(s.margin,1)} lb</span></div>
          <div><span class="k">&nbsp;</span><span class="v ${neg?"neg":""}">${s.margin!==undefined?fmt(s.margin/LBKG,1)+" kg":"—"}</span></div>
          <div><span class="k">Cutoff${s.dst?" · "+esc(s.dst):""}</span><span class="v">${floor2(s.cutoff)}</span></div>
        </div></button>`;
    }).join("") : `<div class="empty">No saved calculations yet. Enter a name on the Calculation tab and tap Save.</div>`}</div></main>`;
  $$("[data-h]").forEach(el => {
    const id = el.dataset.h;
    longPress(el, () => {
      const h = DB.history.find(x => x.id === id);
      confirmSheet("Delete calculation?", `“${h.name}” will be removed from history.`, "Delete", () => { DB.history = DB.history.filter(x => x.id !== id); save("history"); renderHistory(); toast("Deleted"); });
    });
    el.addEventListener("click", () => {
      const h = DB.history.find(x => x.id === id); if (!h) return;
      C = Object.assign(blankCalc(), JSON.parse(JSON.stringify(h.inputs))); saveCurrent();
      location.replace("#calc"); toast("Opened " + h.name);
    });
  });
}

/* ============ AIRCRAFT ============ */
function renderAircraft(){
  const groups = {};
  DB.aircraft.forEach(a => (groups[a.flight||"Other"] = groups[a.flight||"Other"] || []).push(a));
  app.innerHTML = appbar("aircraft") + `<main>
    <button class="ghost full" id="addAc">+ Add aircraft</button>
    ${Object.keys(groups).sort().map(g => `<div class="group">${esc(g)}</div><div class="list">${groups[g].sort((a,b)=>a.tail.localeCompare(b.tail)).map(a => `
      <button class="row" data-ac="${a.id}"><span class="main"><span class="t1">${esc(a.tail)}</span><span class="t2">${esc([a.equipment,a.concessions,a.limitations].filter(Boolean).join(" · ") || "No notes")}</span></span>
      <span class="rt">${fmt(a.emptyLb,1)} lb<small>${fmt(a.emptyLb/LBKG,2)} kg</small></span></button>`).join("")}</div>`).join("") || `<div class="empty">No aircraft yet. Tap Add aircraft to enter a tail number and empty weight.</div>`}
    <div class="divider"></div>
    <button class="row" id="toEq"><span class="main"><span class="t1">Optional equipment weights</span><span class="t2">${DB.items.length} items · used in Misc weight</span></span>${ICON.chev}</button>
  </main>`;
  $("#addAc").addEventListener("click", () => go("acedit:new"));
  $("#toEq").addEventListener("click", () => go("equipment"));
  $$("[data-ac]").forEach(b => b.addEventListener("click", () => go("acedit:"+b.dataset.ac)));
}
function renderAircraftEdit(id){
  const isNew = id === "new";
  const a = isNew ? {id:uid(), flight:"", tail:"", emptyLb:"", equipment:"", concessions:"", limitations:""} : DB.aircraft.find(x => x.id === id);
  if (!a){ location.replace("#aircraft"); return; }
  const flights = [...new Set(DB.aircraft.map(x => x.flight).filter(Boolean))];
  app.innerHTML = subbar(isNew ? "Add aircraft" : a.tail, "aircraft") + `<main>
    <div class="g2">${field("f-tail","Aircraft number",a.tail,"",{text:true,ph:"Z-0000"})}${field("f-flt","Flight",a.flight,"",{text:true,ph:"20 Flt"})}</div>
    ${flights.length ? `<div class="helptext">Flights in use: ${flights.map(esc).join(", ")}</div>` : ""}
    <div class="field"><span class="flabel">Empty weight</span><div class="g2">
      <div class="box"><input id="f-kg" inputmode="decimal" aria-label="Empty weight in kg" value="${a.emptyLb!==""?+(a.emptyLb/LBKG).toFixed(2):""}"><span class="unit">kg</span></div>
      <div class="box"><input id="f-lb" inputmode="decimal" aria-label="Empty weight in lb" value="${esc(a.emptyLb)}"><span class="unit">lb</span></div></div></div>
    <div class="field"><label for="f-eq">Additional equipment</label><textarea id="f-eq" class="note">${esc(a.equipment)}</textarea></div>
    <div class="field"><label for="f-con">Concessions</label><textarea id="f-con" class="note">${esc(a.concessions)}</textarea></div>
    <div class="field"><label for="f-lim">Limitations</label><textarea id="f-lim" class="note">${esc(a.limitations)}</textarea></div>
    <button class="primary" id="f-save">Save aircraft</button>
    ${isNew ? "" : `<button class="ghost danger full" id="f-del">Delete aircraft</button>`}
  </main>`;
  $("#f-kg").addEventListener("input", e => { const v = n(e.target.value); $("#f-lb").value = isNaN(v) ? "" : +(v*LBKG).toFixed(1); });
  $("#f-lb").addEventListener("input", e => { const v = n(e.target.value); $("#f-kg").value = isNaN(v) ? "" : +(v/LBKG).toFixed(2); });
  $("#f-save").addEventListener("click", () => {
    const tail = $("#f-tail").value.trim(), lb = n($("#f-lb").value);
    if (!tail){ toast("Enter the aircraft number"); $("#f-tail").focus(); return; }
    if (isNaN(lb)){ toast("Enter the empty weight"); $("#f-kg").focus(); return; }
    Object.assign(a, { tail, flight:$("#f-flt").value.trim(), emptyLb:+lb.toFixed(1), equipment:$("#f-eq").value.trim(), concessions:$("#f-con").value.trim(), limitations:$("#f-lim").value.trim() });
    if (isNew) DB.aircraft.push(a);
    save("aircraft"); toast("Aircraft saved"); back("aircraft");
  });
  if (!isNew) $("#f-del").addEventListener("click", () => confirmSheet("Delete aircraft?", `${a.tail} will be removed. Saved history is not affected.`, "Delete", () => {
    DB.aircraft = DB.aircraft.filter(x => x.id !== a.id); save("aircraft"); if (C.aircraftId === a.id){ C.aircraftId = ""; saveCurrent(); } toast("Deleted"); back("aircraft");
  }));
}
function renderEquipment(){
  app.innerHTML = subbar("Optional equipment","aircraft") + `<main>
    <div class="helptext">Weights in lb. Changes are saved as you type and used for new selections in Misc weight.</div>
    <div class="list" id="eq">${DB.items.map(i => `
      <div class="eqrow" data-eq="${i.id}"><div class="box"><input class="txt" data-f="name" inputmode="text" value="${esc(i.name)}" aria-label="Item name"></div>
        <div class="box"><input data-f="wt" inputmode="decimal" value="${esc(i.wt)}" aria-label="Weight in lb"><span class="unit">lb</span></div>
        <button class="iconbtn" data-rm="${i.id}" aria-label="Delete ${esc(i.name)}">${ICON.trash}</button></div>`).join("")}</div>
    <button class="linkbtn" id="addEq">+ Add equipment</button>
  </main>`;
  $$("[data-eq]").forEach(row => {
    const it = DB.items.find(x => x.id === row.dataset.eq);
    $$("[data-f]", row).forEach(inp => inp.addEventListener("input", e => {
      if (inp.dataset.f === "wt"){ const v = n(e.target.value); if (!isNaN(v)) it.wt = v; } else it.name = e.target.value;
      save("items");
    }));
  });
  $$("[data-rm]").forEach(b => b.addEventListener("click", () => {
    const it = DB.items.find(x => x.id === b.dataset.rm);
    confirmSheet("Delete equipment?", `${it.name} will be removed from the list.`, "Delete", () => { DB.items = DB.items.filter(x => x.id !== it.id); save("items"); renderEquipment(); });
  }));
  $("#addEq").addEventListener("click", () => { DB.items.push({id:uid(), name:"New item", wt:0}); save("items"); renderEquipment(); const ins = $$("#eq .txt"); const last = ins[ins.length-1]; last.focus(); last.select(); });
}

/* ============ HELIPADS ============ */
let heliQuery = "";
function renderHelipads(){
  app.innerHTML = appbar("helipads") + `<main>
    <div class="g2" style="grid-template-columns:minmax(0,1fr) auto">
      <div class="box"><input id="hq" class="txt" inputmode="search" placeholder="Search helipads" value="${esc(heliQuery)}" aria-label="Search helipads"></div>
      <button class="ghost" id="addH">+ Add</button></div>
    <div id="hlist"></div></main>`;
  $("#hq").addEventListener("input", e => { heliQuery = e.target.value; drawHelis(); });
  $("#addH").addEventListener("click", () => go("hedit:new"));
  drawHelis();
}
function drawHelis(){
  const q = heliQuery.trim().toLowerCase();
  const groups = {};
  DB.helipads.filter(h => !q || h.name.toLowerCase().includes(q) || (h.region||"").toLowerCase().includes(q))
    .forEach(h => (groups[h.region||"Other"] = groups[h.region||"Other"] || []).push(h));
  const regions = Object.keys(groups).sort((a,b) => { const ia = REGION_ORDER.indexOf(a), ib = REGION_ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b); });
  $("#hlist").innerHTML = regions.map(r => `<div class="group">${esc(r)}</div><div class="list">${groups[r].sort((a,b)=>a.name.localeCompare(b.name)).map(h => `
    <button class="row" data-he="${h.id}"><span class="main"><span class="t1">${esc(h.name)}${h.margin>=.15?`<span class="mtag">0.15</span>`:""}</span>
      <span class="t2">LDG ${esc(h.ldg||"—")}${h.temp!==""&&h.temp!=null?` · ${esc(h.temp)} °C`:""}${h.date?` · ${esc(h.date)}`:""}${h.note?` · ${esc(h.note)}`:""}</span></span>
      <span class="rt">${h.elev==null||h.elev===""?`<span style="color:var(--accent)">Add</span>`:fmt(h.elev)+" ft"}</span></button>`).join("")}</div>`).join("")
    || `<div class="empty">No helipads match “${esc(heliQuery)}”.</div>`;
  $$("[data-he]").forEach(b => b.addEventListener("click", () => go("hedit:"+b.dataset.he)));
}
function renderHelipadEdit(id){
  const isNew = id === "new";
  const h = isNew ? {id:uid(), region:"", name:"", elev:null, ldg:"", margin:.10, note:"", temp:"", date:""} : heli(id);
  if (!h){ location.replace("#helipads"); return; }
  const regions = [...new Set(DB.helipads.map(x => x.region).filter(Boolean))];
  app.innerHTML = subbar(isNew ? "Add helipad" : h.name, "helipads") + `<main>
    ${field("h-name","Helipad name",h.name,"",{text:true})}
    <div class="g2">${field("h-elev","Elevation",h.elev==null?"":h.elev,"ft")}${field("h-ldg","Landing direction",h.ldg,"",{text:true,ph:"09/27"})}</div>
    <div class="g2">${field("h-temp","Temperature",h.temp,"°C",{pm:true})}
      <div class="field"><label for="h-date">Date elevation recorded</label><div class="box"><input id="h-date" type="date" class="txt" value="${esc(h.date)}"></div></div></div>
    <div class="field"><label for="h-region">Region</label><div class="box"><input id="h-region" class="txt" inputmode="text" list="regions" value="${esc(h.region)}"></div>
      <datalist id="regions">${regions.map(r => `<option value="${esc(r)}">`).join("")}</datalist></div>
    <div class="field"><label for="h-margin">Take-off margin (cutoff power)</label><select id="h-margin" class="sel">
      <option value="0.10" ${h.margin<.15?"selected":""}>0.10 · standard</option>
      <option value="0.15" ${h.margin>=.15?"selected":""}>0.15 · peculiar helipad (0.85 or max − 0.15, whichever is less)</option></select></div>
    <div class="field"><label for="h-note">Peculiarity / notes</label><textarea id="h-note" class="note">${esc(h.note)}</textarea></div>
    <button class="primary" id="h-save">Save helipad</button>
    ${isNew ? "" : `<button class="ghost danger full" id="h-del">Delete helipad</button>`}
  </main>`;
  $("#h-save").addEventListener("click", () => {
    const name = $("#h-name").value.trim();
    if (!name){ toast("Enter the helipad name"); $("#h-name").focus(); return; }
    const ev = n($("#h-elev").value);
    Object.assign(h, { name, elev: isNaN(ev) ? null : ev, ldg:$("#h-ldg").value.trim(), temp:$("#h-temp").value.trim(), date:$("#h-date").value,
      region:$("#h-region").value.trim() || "Other", margin: parseFloat($("#h-margin").value), note:$("#h-note").value.trim() });
    if (isNew) DB.helipads.push(h);
    save("helipads"); toast("Helipad saved"); back("helipads");
  });
  if (!isNew) $("#h-del").addEventListener("click", () => confirmSheet("Delete helipad?", `${h.name} will be removed from the list.`, "Delete", () => {
    DB.helipads = DB.helipads.filter(x => x.id !== h.id); save("helipads");
    if (C.depHeli === h.id) C.depHeli = ""; if (C.dstHeli === h.id) C.dstHeli = ""; saveCurrent();
    toast("Deleted"); back("helipads");
  }));
}

route();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}
</script>
